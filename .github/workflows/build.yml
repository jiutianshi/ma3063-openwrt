name: Build OpenWrt for Ruijie RG-MA3063

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'files/**'
      - 'config-ma3063.seed'
      - '.github/workflows/build.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout this repo (patches + dts + config)
        uses: actions/checkout@v4
        with:
          path: ma3063-patches

      - name: Checkout OpenWrt source (hzyitc ipq50xx 23.05)
        uses: actions/checkout@v4
        with:
          repository: hzyitc/openwrt-redmi-ax3000
          ref: ipq50xx-mainline-kernel-5.15-openwrt-23.05
          path: openwrt
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib \
            gettext git libncurses5-dev libssl-dev python3-distutils rsync unzip \
            zlib1g-dev file wget ccache

      - name: Copy MA3063 DTS into tree
        run: |
          cp ma3063-patches/files/target/linux/ipq50xx/dts/ipq5018-ruijie-ma3063.dts \
             openwrt/target/linux/ipq50xx/dts/ipq5018-ruijie-ma3063.dts

      - name: Register MA3063 device in image/Makefile
        # 必须插在 $(eval $(call BuildImage)) 之前，否则设备定义无效
        run: |
          python3 - <<'PY'
          p = "openwrt/target/linux/ipq50xx/image/Makefile"
          s = open(p).read()
          block = '''

          define Device/ruijie_rg-ma3063
            $(call Device/FitImage)
            $(call Device/UbiFit)
            SOC := ipq5018
            DEVICE_VENDOR := Ruijie
            DEVICE_MODEL := RG-MA3063
            BLOCKSIZE := 128k
            PAGESIZE := 2048
            DEVICE_DTS := ipq5018-ruijie-ma3063
            DEVICE_DTS_CONFIG := config@mp03.5-c1
            IMAGES := nand-factory.ubi sysupgrade.tar
            IMAGE/sysupgrade.tar := sysupgrade-tar | append-metadata
            DEVICE_PACKAGES := ath11k-firmware-ipq5018 ath11k-firmware-qcn6122 ipq-wifi-cmcc_rax3000q
          endef
          TARGET_DEVICES += ruijie_rg-ma3063
          '''
          marker = "$(eval $(call BuildImage))"
          if marker not in s:
              raise SystemExit("ERROR: BuildImage marker not found in image/Makefile")
          s = s.replace(marker, block + "\n" + marker, 1)
          open(p, "w").write(s)
          print("patched image/Makefile OK")
          PY

      - name: Update & install feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Write .config and default
        working-directory: openwrt
        run: |
          cat > .config <<'EOF'
          CONFIG_TARGET_ipq50xx=y
          CONFIG_TARGET_ipq50xx_aarch64=y
          CONFIG_TARGET_ipq50xx_aarch64_DEVICE_ruijie_rg-ma3063=y
          CONFIG_PACKAGE_ath11k-firmware-ipq5018=y
          CONFIG_PACKAGE_ath11k-firmware-qcn6122=y
          CONFIG_PACKAGE_ipq-wifi-cmcc_rax3000q=y
          CONFIG_PACKAGE_wpad-basic-wolfssl=y
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-ssl=y
          # 内核 5.15.150 新增符号(如 ARM64_EPAN)，显式置位避免被当 NEW 提示
          CONFIG_ARM64_EPAN=y
          EOF
          make defconfig

      - name: Download
        working-directory: openwrt
        run: make -j$(nproc) download

      - name: Build
        working-directory: openwrt
        run: |
          set -euo pipefail
          # 第9次构建：根治 syncconfig 的 NEW 符号崩溃（根因已在第8次复盘定位）。
          # 关键事实：ipq50xx 是 SUBTARGETS(arm/aarch64) 目标，aarch64 子目标编译读取的是
          # target/linux/ipq50xx/config-5.15（父级；aarch64/config-5.15 在上游不存在）。
          # 5.15.150 内核相对该模板多出一批 NEW 符号（ARM64_PA_BITS_48、NR_CPUS、ETM4X_IMPDEF_FEATURE 等）。
          # 第8次教训：裸 "make -C $LINUX olddefconfig" 未指定 ARCH，内核按 HOST(x86_64) 生成 .config，
          # 其中无 ARM64_* 符号，写回模板反而污染；compile 以 ARCH=arm64 重建时这些又成 NEW → 崩溃。
          # 根治：OpenWrt 的 prepare 阶段内部已用 ARCH=arm64 跑 oldconfig 生成【完整 arm64 .config】，
          # 直接捕获这份 .config 写回模板即可，不再自己裸跑 olddefconfig。
          #
          # (a) 给所有候选 config-5.15（find 覆盖父级与可能存在的子目标）补已知架构符号，降低交互风险
          for f in $(find target/linux/ipq50xx -name 'config-5.15*' 2>/dev/null); do
            {
              grep -q "CONFIG_ARM64_EPAN" "$f"        || echo "CONFIG_ARM64_EPAN=y"
              grep -q "CONFIG_ARM64_PA_BITS_48" "$f"  || echo "CONFIG_ARM64_PA_BITS_48=y"
              grep -q "CONFIG_ARM64_VA_BITS_39" "$f"  || echo "CONFIG_ARM64_VA_BITS_39=y"
              grep -q "CONFIG_ARM64_4K_PAGES" "$f"    || echo "CONFIG_ARM64_4K_PAGES=y"
              grep -q "CONFIG_QCOM_CLK_APCC_MSM8996" "$f" || echo "# CONFIG_QCOM_CLK_APCC_MSM8996 is not set"
            } >> "$f"
            echo "patched $f"
          done
          # (b) 解包内核并生成【完整 arm64】.config（OpenWrt 以 ARCH=arm64 跑 oldconfig，已固化全部 NEW）
          make target/linux/prepare V=s
          LINUX=$(ls -d build_dir/target-aarch64_cortex-a53_musl/linux-ipq50xx_aarch64/linux-5.15.150 2>/dev/null | head -1)
          [ -n "$LINUX" ] || { echo "linux source dir not found"; exit 1; }
          echo "linux source dir: $LINUX"
          # (c) 以 ARCH=arm64 复核并固化（保险；与 prepare 同源，不会架构错乱）
          make -C "$LINUX" ARCH=arm64 olddefconfig
          # (d) 把完整 arm64 .config 写回模板（父级 + aarch64 子目标若存在），compile 将基于无 NEW 的模板重建
          for f in target/linux/ipq50xx/config-5.15 target/linux/ipq50xx/aarch64/config-5.15; do
            [ -f "$f" ] || continue
            cp "$LINUX/.config" "$f"
            echo "refreshed $f from arm64 .config"
          done
          # (e) 正式编译；yes '' 兜底任何残留交互提示，并正确捕获 make 退出码
          set +o pipefail
          yes '' | make -j$(nproc) V=s 2>&1 | tee build.log
          rc=${PIPESTATUS[1]}
          set -o pipefail
          if [ "$rc" -ne 0 ]; then echo "make failed rc=$rc"; exit "$rc"; fi

      - name: Upload firmware artifact (GitHub UI download)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-ma3063
          path: openwrt/bin/targets/ipq50xx/aarch64/*
          if-no-files-found: error

      - name: Publish build log + firmware to build-output branch
        if: always()
        run: |
          set -euo pipefail
          WS="$GITHUB_WORKSPACE"
          git config --global user.email "wb@local"
          git config --global user.name "WorkBuddy"
          cd "$WS/ma3063-patches"
          cp "$WS/openwrt/build.log" build.log 2>/dev/null || true
          # 精简错误日志（沙箱无法拉 22MB 完整日志，提取关键行便于快速诊断）
          { grep -iE "error|undefined reference|No rule to make|make: \*\*\*|failed|fatal|undeclared|not found|NEW\)" "$WS/openwrt/build.log" 2>/dev/null | tail -150; echo "==== TAIL ===="; tail -n 250 "$WS/openwrt/build.log" 2>/dev/null; } > build_errors.txt 2>/dev/null || true
          mkdir -p firmware
          cp "$WS/openwrt/bin/targets/ipq50xx/aarch64/"*.ubi firmware/ 2>/dev/null || true
          cp "$WS/openwrt/bin/targets/ipq50xx/aarch64/"*sysupgrade* firmware/ 2>/dev/null || true
          git remote set-url origin "https://${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git checkout -B build-output
          git add -A
          git commit -m "build output [skip ci]" || echo "nothing to commit"
          git push --force origin build-output
